apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openfga-explorer.fullname" . }}
  labels:
    {{- include "openfga-explorer.labels" . | nindent 4 }}
data:
  # ── Serveur ──
  ADDR: {{ .Values.addr | quote }}
  WEB_DIR: "/app/web"
  VIEWS_DIR: "/app/views"
  # ── OpenFGA ──
  OPENFGA_URL: {{ .Values.openfga.url | quote }}
  # ── Auth (flags non sensibles) ──
  AUTH_DISABLED: {{ .Values.auth.disabled | quote }}
  SECURE_COOKIES: {{ .Values.auth.secureCookies | quote }}
  RATE_LIMIT_PER_MIN: {{ .Values.auth.rateLimitPerMin | quote }}
  # ── OIDC (injecté uniquement si oidc.issuerUrl est non vide) ──
  {{- if .Values.oidc.issuerUrl }}
  OIDC_ISSUER_URL: {{ .Values.oidc.issuerUrl | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_REDIRECT_URL: {{ .Values.oidc.redirectUrl | quote }}
  OIDC_SCOPES: {{ .Values.oidc.scopes | quote }}
  OIDC_ADMIN_GROUPS: {{ .Values.oidc.adminGroups | quote }}
  OIDC_VIEWER_GROUPS: {{ .Values.oidc.viewerGroups | quote }}
  {{- if .Values.oidc.localLoginDisabled }}
  LOCAL_LOGIN_DISABLED: "1"
  {{- end }}
  {{- end }}
  {{- with .Values.openfga.oidc }}
  {{- if .tokenUrl }}
  # ── Jeton OIDC vers l'API OpenFGA ──
  OPENFGA_OIDC_TOKEN_URL: {{ .tokenUrl | quote }}
  OPENFGA_OIDC_CLIENT_ID: {{ .clientId | quote }}
  OPENFGA_OIDC_USERNAME: {{ .username | quote }}
  OPENFGA_OIDC_SCOPE: {{ .scope | quote }}
  {{- end }}
  {{- end }}
  # ── Tuning optionnel via config.yaml ──
  {{- with .Values.tuning }}
  config.yaml: |-
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v }}
    {{- end }}
  {{- end }}
