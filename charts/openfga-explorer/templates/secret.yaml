{{- $secretName := include "openfga-explorer.fullname" . -}}
{{- /* On crée un Secret géré uniquement si une valeur en clair est fournie
       ET qu'on n'utilise pas un existingSecret. Plusieurs blocs conditionnels
       pour ne jamais écrire une clé vide. */ -}}
{{- $managedSessionSecret := and .Values.auth.secret.sessionSecret.value (not .Values.auth.secret.sessionSecret.existingSecret) -}}
{{- $managedAdminPassword := and .Values.auth.secret.adminPassword.value (not .Values.auth.secret.adminPassword.existingSecret) -}}
{{- $managedOpenfgaToken := and .Values.openfga.token.value (not .Values.openfga.token.existingSecret) -}}
{{- $managedOIDCSecret := and .Values.oidc.issuerUrl .Values.oidc.clientSecret (not .Values.oidc.existingSecret) -}}
{{- $fgaOIDC := .Values.openfga.oidc -}}
{{- $managedFgaOIDC := and $fgaOIDC.tokenUrl (or $fgaOIDC.clientSecret $fgaOIDC.password) (not $fgaOIDC.existingSecret) -}}
{{- if or $managedSessionSecret $managedAdminPassword $managedOpenfgaToken $managedOIDCSecret $managedFgaOIDC -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "openfga-explorer.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $managedSessionSecret }}
  session-secret: {{ .Values.auth.secret.sessionSecret.value | b64enc | quote }}
  {{- end }}
  {{- if $managedAdminPassword }}
  admin-password: {{ .Values.auth.secret.adminPassword.value | b64enc | quote }}
  {{- end }}
  {{- if $managedOpenfgaToken }}
  token: {{ .Values.openfga.token.value | b64enc | quote }}
  {{- end }}
  {{- if $managedOIDCSecret }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if and $managedFgaOIDC $fgaOIDC.clientSecret }}
  openfga-oidc-client-secret: {{ $fgaOIDC.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if and $managedFgaOIDC $fgaOIDC.password }}
  openfga-oidc-password: {{ $fgaOIDC.password | b64enc | quote }}
  {{- end }}
{{- end }}
