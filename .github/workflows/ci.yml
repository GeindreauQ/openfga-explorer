name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.25'

jobs:
  # ── Backend : tests + vet + build ─────────────────────────────────────
  backend:
    name: Go test / vet / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/server/go.sum

      - name: gofmt check
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "gofmt found differences:"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 -race ./...

  # ── Front : tests unitaires + suite Playwright de bout en bout ───────
  e2e:
    name: Web unit + end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/server/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Unit tests (vitest)
        working-directory: tests
        run: npx vitest run

      - name: Start OpenFGA
        run: docker run -d --name openfga -p 8080:8080 openfga/openfga:v1.22.1 run

      - name: End-to-end (Playwright)
        env:
          OPENFGA_URL: http://localhost:8080
        run: sh tests/e2e.sh

  # ── Charts : lint + render ────────────────────────────────────────────
  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint charts/openfga-explorer

      - name: helm template (smoke)
        run: |
          helm template charts/openfga-explorer \
            --set openfga.url=http://openfga.test:8080 \
            --set auth.secret.sessionSecret.value=test-secret-32-chars-minimum-pad \
            --set auth.secret.adminPassword.value=adm \
            > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

  # ── Docker image build (smoke) ────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t openfga-explorer:ci .
      - name: Image size sanity check
        run: |
          SIZE=$(docker image inspect openfga-explorer:ci --format '{{.Size}}')
          echo "Image size: ${SIZE} bytes"
          # 100 MB cap — distroless est petit en pratique.
          if [ "$SIZE" -gt 104857600 ]; then
            echo "Image > 100MB, investigate the multi-stage build"
            exit 1
          fi
